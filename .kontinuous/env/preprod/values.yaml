app:
  annotations:
    oblik.socialgouv.io/min-limit-cpu: 2

api:
  resources:
    requests:
      memory: 6Gi
    limits:
      memory: 6Gi
  annotations:
    oblik.socialgouv.io/min-limit-cpu: "3"
    oblik.socialgouv.io/min-request-cpu: "3"
    oblik.socialgouv.io/min-request-memory: "6Gi"
  envFrom:
    - configMapRef:
        name: graal
    - secretRef:
        name: graal-dev-app-access-key
    - secretRef:
        name: graal-preprod
    - secretRef:
        name: pg-app
  env:
    - name: FRONTEND_URL
      value: "https://{{ .Values.global.host }}"
    - name: PROCONNECT_REDIRECT_URI
      value: "https://api-{{ .Values.global.host }}/api/v1/auth/callback"
    - name: S3_BUCKET_NAME
      valueFrom:
        secretKeyRef:
          name: graal-dev-app-access-key
          key: bucket_name
    - name: USE_S3_CONFIG
      value: "true"
    - name: S3_BUCKET_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: graal-dev-app-access-key
          key: bucket_endpoint
    - name: S3_BUCKET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: graal-dev-app-access-key
          key: bucket_access_key
    - name: S3_BUCKET_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: graal-dev-app-access-key
          key: bucket_secret_key

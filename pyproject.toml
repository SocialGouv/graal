[tool.poetry]
name = "GRAAL"
version = "1.0.0"
description = ""
authors = ["Victor DEGLIAME <victor.degliame@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.2"
openpyxl = "^3.1.4"
ollama = "^0.2.1"
rapidfuzz = "^3.9.4"
numpy = "^1.26.4"
scikit-learn = "^1.5.1"
scipy = "^1.14.0"
python-levenshtein = "^0.25.1"
pytest = "^8.2.2"
beautifulsoup4 = "^4.12.3"
unidecode = "^1.3.8"
nltk = "^3.8.1"
pytest-cov = "^5.0.0"
pytest-xdist = "^3.6.1"
tabulate = "^0.9.0"
openai = "^1.44.1"
pytest-mock = "^3.14.0"
colorlog = "^6.8.2"
requests = "^2.32.3"
xlsxwriter = "^3.2.0"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["livecov"]
omit = [
    "graal/build_summary_test_sample.py",
    "graal/merge_json_lectures.py",
    "graal/types.py",
    "graal/summary/summary_prompt_builder.py",
]

[tool.coverage.report]
include_namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["dist", "build", "dev", "typings"]
addopts = [
    "-n 4",
    "--cov=graal",
    "--cov-report=lcov:lcov.info",
    "--cov-report=json:coverage.json",
    "--cov-report=",
    "--capture=no",
    "--log-cli-level=INFO",
    "--color=yes",
]

[tool.ruff]
select = ["E", "F", "W", "C", "N", "B", "Q", "S"]
ignore = [
    "D100",  # missing-module-docstring
    "D101",  # missing-class-docstring
    "D103",  # missing-function-docstring
    "E501",  # line-too-long
    "F811",  # redefined-outer-name
    "G001",  # logging-fstring-interpolation
    "N802",  # invalid-name
    "N806",  # non-lowercase-variable-in-function
    "S301",  # pickle is considered harmful
    "S311",  # standard pseudo-random generators are not suitable for security/cryptographic purposes
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = [
    "B018",  # B018 - Found useless expression - necessary for testing exceptions are raised.
    "D100",  # D100 - Module dostrings not required in test files.
    "D104",  # D104 - Package dostrings not required in test files.
    "S101",  # S101 - Use of assert in tests is fine.
]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["call-overload", "import-untyped"]

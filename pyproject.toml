[tool.poetry]
name = "amendements-intelligents"
version = "1.0.0"
description = ""
authors = ["Victor DEGLIAME <victor.degliame@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.2"
openpyxl = "^3.1.4"
ollama = "^0.2.1"
torch = "^2.3.1"
transformers = "^4.42.1"
datasets = "^2.20.0"
accelerate = "^0.31.0"
sentence-transformers = "^3.0.1"
chromadb = "^0.5.3"
rapidfuzz = "^3.9.4"
datasketch = "^1.6.5"
numpy = "^1.26.4"
scikit-learn = "^1.5.1"
scipy = "^1.14.0"
python-levenshtein = "^0.25.1"
google-cloud-aiplatform = "^1.59.0"
pytest = "^8.2.2"
beautifulsoup4 = "^4.12.3"
unidecode = "^1.3.8"
nltk = "^3.8.1"
groq = "^0.9.0"
pytest-cov = "^5.0.0"
pytest-xdist = "^3.6.1"
tabulate = "^0.9.0"
openai = "^1.44.1"
pytest-mock = "^3.14.0"
colorlog = "^6.8.2"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = ["livecov"]
omit = [
    "amendements_intelligents/build_summary_test_sample.py",
    "amendements_intelligents/merge_json_lectures.py",
    "amendements_intelligents/types.py",
    "amendements_intelligents/summary/summary_prompt_builder.py",
]

[tool.coverage.report]
include_namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["dist", "build", "dev", "typings"]
addopts = [
    "-n 4",
    "--cov=amendements_intelligents",
    "--cov-report=lcov:lcov.info",
    "--cov-report=json:coverage.json",
    "--cov-report=",
    "--capture=no",
    "--log-cli-level=INFO",
    "--color=yes",
]

[tool.pylint]
disable = [
    "line-too-long",
    "missing-function-docstring",
    "missing-module-docstring",
    "missing-class-docstring",
    "redefined-outer-name",
    "protected-access",
    "invalid-name",
    "logging-fstring-interpolation",
    "fixme"
]

[tool.mypy]
ignore_missing_imports = true

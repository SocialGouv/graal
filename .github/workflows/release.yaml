name: 📦 Create release

on:
  workflow_dispatch:
  push:
    branches: [main, alpha, beta, next]

permissions:
  id-token: write  # Required for OIDC token generation

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Get GitHub App Token
      id: token
      uses: SocialGouv/token-bureau@main
      with:
        token-bureau-url: https://token-bureau.fabrique.social.gouv.fr
        audience: socialgouv

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ steps.token.outputs.token }}

    - name: Clean Semantic Release notes to prevent loops
      run: |
        git fetch origin 'refs/notes/*:refs/notes/*' || true
        git notes --ref=semantic-release prune || true
        git push origin 'refs/notes/*:refs/notes/*' --force || true

    - uses: SocialGouv/actions/autodevops-release@v1
      with:
        github-token: ${{ steps.token.outputs.token }}
        author-name: ${{ secrets.SOCIALGROOVYBOT_NAME }}
        author-email: ${{ secrets.SOCIALGROOVYBOT_EMAIL }}

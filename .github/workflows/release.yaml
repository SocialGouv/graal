name: 📦 Create release

on:
  workflow_dispatch:
  push:
    branches: [main, alpha, beta, next]

permissions:
  id-token: write  # Required for OIDC token generation

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Get GitHub App Token
      id: token
      uses: SocialGouv/token-bureau@main
      with:
        token-bureau-url: https://token-bureau.fabrique.social.gouv.fr
        audience: socialgouv

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ steps.token.outputs.token }}

    - name: Clean semantic-release notes and check for orphaned tags
      run: |
        echo "🔍 Cleaning git notes and checking for orphaned tags..."
        
        # Fetch tags from origin
        git fetch origin --tags --force
        
        # Delete ALL semantic-release notes (locally and on origin)
        echo "🗑️  Deleting semantic-release git notes..."
        git for-each-ref refs/notes/semantic-release | cut -f2 | xargs -r git update-ref -d || true
        git push origin --delete refs/notes/semantic-release || echo "ℹ️  Notes already absent"
        
        # Check for orphaned tags
        echo "🔍 Checking for orphaned tags..."
        orphaned_tags_found=false
        
        git ls-remote --tags origin | grep 'refs/tags/v[0-9]' | while read commit_hash tag_ref; do
          tag_name=$(echo $tag_ref | sed 's|refs/tags/||')
          if ! git cat-file -e $commit_hash 2>/dev/null; then
            echo "❌ Orphaned tag detected: $tag_name (commit $commit_hash does not exist)"
            orphaned_tags_found=true
          fi
        done
        
        if [ "$orphaned_tags_found" = true ]; then
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  ERROR: Orphaned tags detected!"
          echo ""
          echo "This usually happens after a force push/rebase on main."
          echo "To fix this, manually delete the orphaned tags:"
          echo ""
          echo "  git push origin --delete refs/tags/<tag_name>"
          echo ""
          echo "Then re-run the workflow."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
        fi
        
        echo "✅ Cleanup complete, no orphaned tags detected"

    - uses: SocialGouv/actions/autodevops-release@v1
      with:
        github-token: ${{ steps.token.outputs.token }}
        author-name: ${{ secrets.SOCIALGROOVYBOT_NAME }}
        author-email: ${{ secrets.SOCIALGROOVYBOT_EMAIL }}

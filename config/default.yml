# GRAAL Configuration File
# This file contains all configuration parameters for the GRAAL amendment processing system

# General similarity thresholds
similarity_thresholds:
  # Threshold for TF-IDF similarity calculations
  tf_idf_threshold: 0.4

# Allotment configuration - groups amendments by similarity
allotment:
  enabled: false
  column: "Corps amdt"  # Column used for similarity comparison
  similarity_threshold: 0.999  # Threshold above which amendments are considered similar

# Configuration for finding similarities within lecture documents
similarities_within_lectures:
  enabled: false
  column: "Exposé amdt"  # Column used for similarity comparison
  similarity_threshold: 0.8  # Threshold above which amendments are considered similar

# Similarity search configuration - finds similar amendments from historical data
similarity_search:
  enabled: false
  # Whether to overwrite existing values in amendment fields (default: true)
  should_overwrite: true
  # Clustering similarity thresholds for initial TF-IDF clustering
  clustering_similarity_thresholds:
    "Exposé amdt": 0.4
    "Corps amdt": 0.4
  # Fuzzy match similarity thresholds for precise Damerau-Levenshtein comparison
  fuzzy_match_similarity_thresholds:
    "Exposé amdt": 0.4
    "Corps amdt": 0.9
  # Similarity threshold overrides for specific columns and amendment types
  similarity_threshold_overrides:
    "Exposé amdt":
      "amendement redactionnel": 0.95
  # UUID of the similarity database manifest (required when enabled)
  # Example: "c52c1e2f-2a07-4d7d-9f4e-2af5f0c3f1a1"
  database_id: null
  # Columns to copy from similar amendments
  columns_to_copy:
    Réponse:
      enabled: true
    Sort:
      enabled: true
      condition: "irrecevable"  # Only copy if condition matches
    "Objet amdt":
      enabled: false

# Attribution settings
attribution:
  enabled: true
  # Each project can have a different attribution handler so we need to specify the project name
  project_name: "PLF"

# Processing options
processing_options:
  placeholder_amdt_body: false

# Enable summary generation for amendments
summary_generation:
  enabled: false
  should_overwrite: true
  # Strategy: "dspy" for optimized prompts or "legacy" for traditional prompts
  strategy: "legacy"  # Options: "dspy" or "legacy"
  # DSPy-specific configuration (only used when strategy is "dspy")
  dspy:
    office_name: "office_A"  # Office/team name for prompt management
    s3_prompt_base: "summary_prompts/"  # S3 base path for storing optimized prompts
    cache_ttl_seconds: 300  # Cache time-to-live in seconds (5 minutes)
    # Evaluation metric weights for optimization
    metrics:
      semantic_weight: 0.7  # Weight for semantic similarity (0-1)
      length_weight: 0.3    # Weight for length constraint (0-1)
      verb_weight: 0.0      # Weight for infinitive verb form (bonus only)
      embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"  # Model for semantic similarity
    # Training dataset configuration
    training:
      default_train_ratio: 0.8  # Default train/validation split ratio
      min_summary_words: 8      # Minimum acceptable summary length in words
      max_summary_words: 20     # Maximum acceptable summary length in words
      dataset_s3_prefix: "dspy_datasets/"  # S3 prefix for storing training datasets

# Enable default opinion for amendments
default_opinion:
  enabled: false
  should_overwrite: true

# File paths configuration
paths:
  # Path to GRAAL configuration Excel file
  graal_config_file: "${DATA_FOLDER}/config_graal/Fichier de configuration GRAAL - PLF_vDGCS - latest.xlsx"

# Input files configuration
input_files:
  - path: "${DATA_FOLDER}/input_plf/PLF2025_L1_AN_SP.json"
    # Default timestamp to use for processing if not specified
    default_processing_timestamp:
      year: 2025
      month: 4
      day: 28
    # Project name, mainly used for similarity search (we match on origin_project)
    origin_project: "PLF 2025"

# Parallel processing configuration
parallel_processing:
  max_workers: 4  # Number of parallel threads (adjust based on your system)

# Output configuration
output:
  # Template for output file prefix, includes date formatting
  file_prefix_template: "${DATA_FOLDER}/résultats_attribution_PLF_DGS_test_%Y-%m-%d"
  # CSV separator character (semicolon is common in European formats)
  csv_separator: ";"
  # Columns to include in Excel file
  columns:
    - "Num amdt"
    - "Num article"
    - "Mission"
    - "Allotissement"
    - "Objet amdt"
    - "Sort"
    - "Réponse"
    - "Affectation (nom)"
    - "Affectation (email)"
    - "Entité Pilote"
    - "Avis du Gouvernement"
    - "Groupe"
    - "Exposé amdt"
    - "Corps amdt"
    - "Commentaires"
    - "amdt_idx"
    - "A été dans le Dossier de Banc"

# GRAAL Configuration File
# This file contains all configuration parameters for the GRAAL amendment processing system

# Threshold for TF-IDF similarity calculations
tf_idf_threshold: 0.4

# Allotment configuration - groups amendments by similarity
allotments:
  enabled: true
  column: "Corps amdt"  # Column used for similarity comparison
  similarity_threshold: 0.99  # Threshold above which amendments are considered similar

# Configuration for finding similarities within lecture documents
similarities_within_lectures:
  enabled: true
  column: "Exposé amdt"  # Column used for similarity comparison
  similarity_threshold: 0.8  # Threshold above which amendments are considered similar

# Attribution settings
attribution_interstitial_only: false
attribution: false
attribution_project_name: "PPL FDV"
handle_inadmissible_amendments: false
no_value_overwrite: false
placeholder_amdt_body: false

# Similarity search configuration - finds similar amendments
similarity_search:
  enabled: true
  columns_to_copy:  # Columns to copy from similar amendments
    Réponse:
      enabled: true
    Sort:
      enabled: true
      condition: "irrecevable"  # Only copy if condition matches
    "Objet amdt":
      enabled: true

# Enable summary generation for amendments
summary_generation:
  enabled: true
  should_overwrite: false

# Enable default opinion for amendments
default_opinion: false

# Filter for mission short titles
mission_short_title_filter: []

# LLM client configuration
llm_clients:
  # scaleway:
  #   nb_instances: 6
  #   timeout: 30  # Timeout in seconds
  fake:
    nb_instances: 1

# File paths configuration
paths:
  # Path to GRAAL configuration Excel file
  graal_config_file: "${DATA_FOLDER}/config_graal/Fichier de configuration GRAAL - DSS - latest.xlsx"
  # Path to preprocessed inadmissible amendments file
  preprocessed_inadmissible_file: "${DATA_FOLDER}/preprocessed/inadmissible_commission.pkl"
  # Path to preprocessed old amendments database
  preprocessed_old_amendments_file: "${DATA_FOLDER}/preprocessed/DB_PPL_FIN_DE_VIE_2025.pkl"

# Input files configuration
input_files:
  - path: "${DATA_FOLDER}/input_ppl_fin_vie/AN_Commission_PPL_SPA.json"
    # Default timestamp to use for processing if not specified
    default_processing_timestamp:
      year: 2025
      month: 5
      day: 6
    origin_project: "PPL Fin de vie 2025"

# Output configuration
output:
  # Template for output file prefix, includes date formatting
  file_prefix_template: "${DATA_FOLDER}/résultats_PPL_fdv_test_%Y-%m-%d"
  # Columns to include in output file
  columns:
    - "Num amdt"
    - "Commentaires"
    - "Allotissement"
    - "Objet amdt"
    - "Sort"
    - "Réponse"
    # - "Affectation (email)"
    # - "Affectation (nom)"
    # - "Entité Pilote"
    # - "Avis du Gouvernement"
    # - "Groupe"
    - "Exposé amdt"
    - "Corps amdt"
    - "Num article"
    # - "amdt_idx"
